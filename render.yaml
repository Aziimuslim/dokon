# Render Blueprint: README'dagi "Deploy to Render" tugmasi shu faylni o'qiydi.
# Baza + veb-servis avtomatik yaratiladi, maxfiy kalitlar avtomatik generatsiya qilinadi.
databases:
  - name: dokon-db
    plan: free
    databaseName: dokon
    user: dokon

services:
  - type: web
    name: online-dokon
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dokon-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ORDER_SIGN_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "true"
