# /etc/nginx/sites-available/dokon  →  ln -s ../sites-available/dokon /etc/nginx/sites-enabled/
# HTTPS: sudo certbot --nginx -d dokon.uz -d www.dokon.uz
server {
    listen 80;
    server_name dokon.uz www.dokon.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dokon.uz www.dokon.uz;

    # certbot quyidagi qatorlarni avtomatik qo'shadi
    # ssl_certificate     /etc/letsencrypt/live/dokon.uz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dokon.uz/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 4m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:4000;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
